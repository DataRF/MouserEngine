[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouser-engine"
version = "1.3.0"
description = "Cotizador de BOM con precios y stock en tiempo real desde la Mouser Search API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.3"]

[project.gui-scripts]
mouser-engine = "mouser_engine.app:main"

[tool.setuptools]
packages = ["mouser_engine", "mouser_engine.gui"]

[tool.setuptools.package-data]
mouser_engine = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
