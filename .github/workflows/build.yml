name: Pruebas y compilación

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # necesario para adjuntar el .exe a un Release al crear un tag v*

jobs:
  tests:
    name: Pruebas (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Ejecutable de Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas en Windows
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Compilar MouserEngine.exe
        run: pyinstaller --noconfirm --clean MouserEngine.spec
      - name: Autoprueba del ejecutable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $proc = Start-Process -FilePath "dist\MouserEngine.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $env:TEMP "mouser_engine_selftest.log")
          if ($proc.ExitCode -ne 0) { throw "La autoprueba falló (código $($proc.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: MouserEngine-windows
          path: dist/MouserEngine.exe
          if-no-files-found: error
      - name: Publicar en Releases (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MouserEngine.exe
